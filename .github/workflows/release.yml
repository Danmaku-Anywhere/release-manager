name: Release

# Builds and releases the app.
#
# Flow:
#   1. Push a v<version> tag. The draft job creates a DRAFT release, then the
#      Linux, macOS and Windows jobs build in parallel and upload their bundles to
#      it. Linux and macOS also upload signed updater bundles (.sig files).
#   2. The manifest job writes latest.json from those signatures. Building it in
#      one place, after every platform finished, means no job can overwrite
#      another platform's entry.
#   3. A human reviews and PUBLISHES the draft. It then becomes the repo's latest
#      release, and the in-app updater reads its latest.json through GitHub's
#      releases/latest/download URL, so updates only go live on publish.
#
# A manual run builds every bundle without creating a release and uploads them
# as workflow artifacts. Windows has no self-update, so its job needs no signing
# key.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes \
            --title "Release Manager $GITHUB_REF_NAME"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ubuntu-22.04
    # The minisign signing key lives in this Environment, not in repo-wide
    # secrets, so only the signing jobs can read it and forks never see it.
    environment: release-manager-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and upload
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          args: "--bundles appimage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-macos:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: macos-latest
    environment: release-manager-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and upload
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          args: "--bundles app,dmg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload the installer
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          # Installer only: no updater artifacts (disabled via the config override),
          # so this job needs no signing key.
          args: "--bundles nsis --config src-tauri/tauri.windows.conf.json"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # The plain build output already embeds the frontend, so it runs without
      # the installer. It still needs the WebView2 runtime, which Windows 11 ships.
      - name: Stage portable executable
        id: portable
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          file="portable/release-manager_${version}_x64-portable.exe"
          mkdir -p portable
          cp src-tauri/target/release/release-manager.exe "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-windows-portable
          path: ${{ steps.portable.outputs.file }}
          if-no-files-found: error

      - name: Attach portable executable to the draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.portable.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber

  manifest:
    needs: [ draft, build-linux, build-macos ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the update signatures
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs

      - name: Write latest.json
        shell: python
        run: |
          import datetime, glob, json, os, urllib.parse

          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"

          def entry(pattern):
              matches = glob.glob(f"sigs/{pattern}")
              if len(matches) != 1:
                  raise SystemExit(f"expected one {pattern}, found {matches}")
              sig = matches[0]
              asset = os.path.basename(sig)[: -len(".sig")]
              return {
                  "signature": open(sig).read().strip(),
                  "url": base + urllib.parse.quote(asset),
              }

          linux = entry("*.AppImage.sig")
          mac = entry("*.app.tar.gz.sig")
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "linux-x86_64": linux,
                  "linux-x86_64-appimage": linux,
                  "darwin-aarch64": mac,
                  "darwin-aarch64-app": mac,
              },
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)

      - name: Upload latest.json
        run: gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
