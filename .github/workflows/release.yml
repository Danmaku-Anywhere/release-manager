name: Release

# Builds and releases the app.
#
# Flow:
#   1. Push a v<version> tag. The app is built with the tag's version, so the
#      version in the repo files does not need a bump first. The draft job
#      creates a DRAFT release, then the Linux, macOS and Windows jobs build in
#      parallel and upload their bundles to it. Linux and macOS also upload
#      signed updater bundles (.sig files).
#   2. The manifest job writes latest.json from those signatures. Building it in
#      one place, after every platform finished, means no job can overwrite
#      another platform's entry.
#   3. The publish job checks the draft has every bundle and that the updater
#      bundles verify against the public key installed apps trust, then
#      publishes it as the latest release. The in-app updater reads latest.json
#      through GitHub's releases/latest/download URL, so updates go live here.
#      If any build or check fails, the release stays a draft.
#
# A manual run builds every bundle without creating a release and uploads them
# as workflow artifacts. Windows has no self-update, so its job needs no signing
# key.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the commit is on master
        run: |
          git fetch origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::$GITHUB_SHA is not on master, refusing to build or sign it"
            exit 1
          fi

  draft:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Check the tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Danmaku Builds $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: [ gate, draft ]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: ubuntu-22.04
    # The minisign signing key lives in this Environment, not in repo-wide
    # secrets, so only the signing jobs can read it and forks never see it.
    environment: release-manager-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Restores the cache warm-release-cache.yml saves on master. Tags can't
      # read each other's caches, so saving one here would be wasted.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ runner.os }}
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use the tag as the app version
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/set-version.cjs "${GITHUB_REF_NAME#v}"

      - name: Build, sign, and upload
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          args: "--bundles appimage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-macos:
    needs: [ gate, draft ]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: macos-latest
    environment: release-manager-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Restores the cache warm-release-cache.yml saves on master. Tags can't
      # read each other's caches, so saving one here would be wasted.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ runner.os }}
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use the tag as the app version
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/set-version.cjs "${GITHUB_REF_NAME#v}"

      - name: Build, sign, and upload
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          args: "--bundles app,dmg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    needs: [ gate, draft ]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Restores the cache warm-release-cache.yml saves on master. Tags can't
      # read each other's caches, so saving one here would be wasted.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ runner.os }}
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use the tag as the app version
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/set-version.cjs "${GITHUB_REF_NAME#v}"

      - name: Build and upload the installer
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          # Installer only: no updater artifacts (disabled via the config override),
          # so this job needs no signing key.
          args: "--bundles nsis --config src-tauri/tauri.windows.conf.json"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # The plain build output already embeds the frontend, so it runs without
      # the installer. It still needs the WebView2 runtime, which Windows 11 ships.
      - name: Stage portable executable
        id: portable
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          file="portable/danmaku-builds_${version}_x64-portable.exe"
          mkdir -p portable
          cp src-tauri/target/release/release-manager.exe "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-windows-portable
          path: ${{ steps.portable.outputs.file }}
          if-no-files-found: error

      - name: Attach portable executable to the draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.portable.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber

  manifest:
    needs: [ draft, build-linux, build-macos ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the update signatures
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs

      - name: Write latest.json
        shell: python
        run: |
          import datetime, glob, json, os, urllib.parse

          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"

          def entry(pattern):
              matches = glob.glob(f"sigs/{pattern}")
              if len(matches) != 1:
                  raise SystemExit(f"expected one {pattern}, found {matches}")
              sig = matches[0]
              asset = os.path.basename(sig)[: -len(".sig")]
              return {
                  "signature": open(sig).read().strip(),
                  "url": base + urllib.parse.quote(asset),
              }

          linux = entry("*.AppImage.sig")
          mac = entry("*.app.tar.gz.sig")
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "linux-x86_64": linux,
                  "linux-x86_64-appimage": linux,
                  "darwin-aarch64": mac,
                  "darwin-aarch64-app": mac,
              },
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)

      - name: Upload latest.json
        run: gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [ draft, build-linux, build-macos, build-windows, manifest ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download the draft's assets
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Check every bundle is there and the update bundles verify
        run: scripts/verify-release.sh assets "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.release_id }}" \
            -F draft=false -f make_latest=true --jq .html_url
